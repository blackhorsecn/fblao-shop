<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="0%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b8860b"/>
      <stop offset="40%" stop-color="#ffd700"/>
      <stop offset="55%" stop-color="#fffacd"/>
      <stop offset="70%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Horse body -->
  <g filter="url(#glow)" fill="url(#goldShine)">
    <!-- Torso -->
    <ellipse cx="40" cy="50" rx="16" ry="11"/>
    <!-- Neck -->
    <path d="M44 40 Q48 30 46 22 Q44 18 40 20 Q36 22 37 30 Q38 36 40 40Z"/>
    <!-- Head -->
    <ellipse cx="44" cy="18" rx="7" ry="5" transform="rotate(-15 44 18)"/>
    <!-- Snout -->
    <path d="M49 16 Q54 14 55 17 Q55 20 50 20Z"/>
    <!-- Ear -->
    <path d="M40 13 Q38 8 41 8 Q44 8 43 13Z"/>
    <!-- Mane -->
    <path d="M40 20 Q35 25 33 35 Q36 33 38 28 Q39 24 40 20Z" opacity="0.85"/>
    <!-- Front legs -->
    <rect x="31" y="58" width="5" height="14" rx="2.5" transform="rotate(5 33 61)"/>
    <rect x="38" y="58" width="5" height="14" rx="2.5" transform="rotate(-5 40 61)"/>
    <!-- Back legs -->
    <rect x="46" y="58" width="5" height="13" rx="2.5" transform="rotate(8 48 61)"/>
    <rect x="52" y="56" width="5" height="14" rx="2.5" transform="rotate(15 54 60)"/>
    <!-- Tail -->
    <path d="M56 48 Q64 44 66 52 Q64 58 58 56 Q60 50 56 48Z" opacity="0.9"/>
    <!-- Hooves -->
    <rect x="30" y="70" width="7" height="3" rx="1.5" fill="#5a3e00"/>
    <rect x="37" y="70" width="7" height="3" rx="1.5" fill="#5a3e00"/>
    <rect x="45" y="69" width="7" height="3" rx="1.5" fill="#5a3e00"/>
    <rect x="52" y="68" width="7" height="3" rx="1.5" fill="#5a3e00"/>
    <!-- Eye -->
    <circle cx="47" cy="16" r="1.5" fill="#1a0a00"/>
    <circle cx="47.5" cy="15.5" r="0.5" fill="#fff" opacity="0.7"/>
  </g>
</svg>
